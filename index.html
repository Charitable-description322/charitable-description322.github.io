<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000; color: #c9d1d9; line-height: 1.6;
      overflow-y: scroll;
      background-image: url('https://preview.redd.it/what-do-you-think-humanity-did-after-the-ending-of-the-2005-v0-9f1z1324rpqe1.jpeg?auto=webp&s=85d566fac420a04ba0ed0462d6af18469e052373');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0) 100%);
      z-index: -1;
    }
    .avatar-fixed {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 80px; border-radius: 50%;
      background: #161b22; border: 2px solid #30363d; z-index: 100;
      overflow: hidden;
    }
    .avatar-fixed img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .spacer { height: 140px; }
    .content { padding: 0 20px 40px; max-width: 720px; margin: 0 auto; }
    .handle { text-align: center; margin-bottom: 8px; }
    .handle h1 { color: #e6edf3; font-size: 24px; }
    .handle .at { color: #8b949e; font-size: 14px; }
    .bio { text-align: center; margin: 16px 0; color: #c9d1d9; font-size: 15px; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; flex-wrap: wrap; }
    .stat { color: #8b949e; font-size: 14px; }
    .stat span { color: #58a6ff; }
    .panel { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .panel h3 { font-size: 16px; color: #e6edf3; margin-bottom: 8px; }
    .panel p { font-size: 14px; color: #8b949e; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #21262d; text-align: center; font-size: 12px; color: #484f58; }
    .music-player {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
      padding: 12px; display: flex; align-items: center; gap: 12px;
      backdrop-filter: blur(10px);
      max-width: 300px;
    }
    .music-player img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .music-player .player-info { flex: 1; min-width: 0; }
    .music-player .player-info .song-title { font-size: 13px; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-player .player-info .song-artist { font-size: 11px; color: #8b949e; }
    .music-player audio { display: none; }
    .music-player .controls { display: flex; gap: 8px; align-items: center; }
    .music-player .controls button {
      background: none; border: 1px solid #30363d; color: #c9d1d9;
      border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px;
    }
    .music-player .controls button:hover { background: #161b22; }
  </style>
</head>
<body>
  <div class="avatar-fixed"><img src="https://images-ext-1.discordapp.net/external/MnFq7Ayc_rOQQaCTWb2t9lwyhigo69zaugW7tV3XBpc/%3Fsize%3D512/https/cdn.discordapp.com/avatars/1139133371683971093/6b941183dd830d0df1a4ce95cb03259b.png?format=webp&quality=lossless" alt="avatar"></div>
  <div class="music-player">
    <img src="song.webp" alt="album art" onerror="this.style.display='none'">
    <div class="player-info">
      <div class="song-title">Song Title</div>
      <div class="song-artist">Artist</div>
    </div>
    <div class="controls">
      <button onclick="document.querySelector('.music-player audio').play()">▶</button>
      <button onclick="document.querySelector('.music-player audio').pause()">⏸</button>
    </div>
    <audio src="song.mp3" preload="none"></audio>
  </div>
  <div class="spacer"></div>
  <div class="content">
    <div class="handle">
      <h1>『!Сapybara¡』</h1>
      <div class="at"></div>
    </div>
    <p class="bio">Developer &amp; maker. Building tools, mods, and experiments.</p>
    <div class="stats">
      <div class="stat"><span>24</span> repos</div>
      <div class="stat"><span>3</span> stars</div>
      <div class="stat"><span>1</span> following</div>
      <div class="stat"><span>0</span> followers</div>
    </div>
    <div class="panel">
      <h3>About</h3>
      <p>
      </p>
    </div>
    <div class="panel">
      <h3>Interests</h3>
      <p></p>
    </div>
    <div class="panel">
      <h3>Projects</h3>
      <p></p>
    </div>
    <div class="panel">
      <h3>Links</h3>
      <p>Discord: sudoeoev<p>
      <p>Telegram: @WotwFan</p>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
