<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; height: auto; }
    body {
      background-color: #000;
      padding-bottom: 60px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000; color: #c9d1d9; line-height: 1.6;
      overflow-y: scroll;
      background-image: url('https://preview.redd.it/what-do-you-think-humanity-did-after-the-ending-of-the-2005-v0-9f1z1324rpqe1.jpeg?auto=webp&s=85d566fac420a04ba0ed0462d6af18469e052373');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0) 100%);
      z-index: -1;
    }
    .trail-dot {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.5);
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.1s ease, transform 0.1s ease;
    }
    #loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .bar { width: 200px; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
    #loader .bar-inner { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width 0.3s ease; }
    #loader .text { color: #8b949e; font-size: 13px; transition: opacity 0.3s ease; }
    #loader .enter-btn {
      opacity: 0; transition: opacity 0.5s ease;
      padding: 10px 24px; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; font-size: 14px; background: #0d1117;
      cursor: pointer;
    }
    #loader .enter-btn:hover { border-color: #fff; }
    #loader.show-btn .enter-btn { opacity: 1; }
    .avatar-fixed {
      position: relative; margin: 40px auto 0;
      width: 150px; height: 150px; border-radius: 50%;
      background: #161b22; border: 3px solid #30363d; z-index: 100;
      overflow: hidden;
    }
    .avatar-fixed img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .spacer { height: 30px; }
    .content { padding: 0 20px 40px; max-width: 720px; margin: 0 auto; }
    .handle { text-align: center; margin-bottom: 8px; }
    .handle h1 { color: #e6edf3; font-size: 24px; }
    .handle .at { color: #8b949e; font-size: 14px; }
    .bio { text-align: center; margin: 40px 0; color: #c9d1d9; font-size: 15px; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 32px 0; flex-wrap: wrap; }
    .stat { color: #8b949e; font-size: 14px; }
    .stat span { color: #58a6ff; }
    .panel {
      background: rgba(13,17,23,0.6); border: 1px solid #21262d; border-radius: 8px; padding: 20px; margin-bottom: 24px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }
    .panel:hover {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    .panel h3 { font-size: 16px; color: #e6edf3; margin-bottom: 8px; }
    .panel p { font-size: 14px; color: #8b949e; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #21262d; text-align: center; font-size: 12px; color: #484f58; }
    .music-player {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: rgba(13,17,23,0.6); border: 1px solid #21262d; border-radius: 8px;
      padding: 12px; display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      min-width: 100px;
    }
    .music-player:hover {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    .music-player img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .music-player img.spinning { animation: spin 3s linear infinite; }
    .music-player .player-info { flex: 1; min-width: 0; }
    .music-player .player-info .song-title { font-size: 13px; color: #e6edf3; white-space: nowrap; }
    .music-player .player-info .song-artist { font-size: 11px; color: #8b949e; }
    .music-player audio { display: none; }
    .music-player .controls { display: flex; gap: 8px; align-items: center; }
    .music-player .controls button {
      background: none; border: 1px solid #30363d; color: #c9d1d9;
      border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px;
    }
    .music-player .controls button:hover { background: #161b22; }
    .music-player input[type="range"] {
      width: 60px; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: #30363d; border-radius: 2px; outline: none;
      cursor: pointer;
    }
    .music-player input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.5);
    }
    .progress-wrap {
      width: 100%; display: flex; align-items: center; gap: 8px;
      position: relative; order: 1;
    }
    .progress-bar {
      flex: 1; height: 4px; background: #30363d; border-radius: 2px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: #fff; border-radius: 2px;
      transition: width 0.1s linear;
    }
    .progress-wrap .time-current,
    .progress-wrap .time-total {
      font-size: 10px; color: #8b949e; min-width: 28px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="bar"><div class="bar-inner" id="loadBar"></div></div>
    <div class="text">Loading...</div>
    <div class="enter-btn" id="enterBtn">Click to Enter</div>
  </div>
  
  <div class="avatar-fixed"><img src="https://images-ext-1.discordapp.net/external/MnFq7Ayc_rOQQaCTWb2t9lwyhigo69zaugW7tV3XBpc/%3Fsize%3D512/https/cdn.discordapp.com/avatars/1139133371683971093/6b941183dd830d0df1a4ce95cb03259b.png?format=webp&quality=lossless" alt="avatar"></div>
  <div class="music-player">
    <img src="song.webp" alt="album art" onerror="this.style.display='none'">
    <div class="player-info">
      <div class="song-title">Seasons In The Sun</div>
      <div class="song-artist">Nirvana</div>
    </div>
    <div class="controls">
      <button id="playBtn">▶</button>
      <button id="pauseBtn">⏸</button>
      <span style="color:#8b949e;font-size:11px">Volume:</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="progress-wrap" id="progressWrap">
      <span class="time-current" id="timeCurrent">0:00</span>
      <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressFill"></div></div>
      <span class="time-total" id="timeTotal">0:00</span>
    </div>
    <audio src="song.mp3" preload="none"></audio>
  </div>
  <script>
    var audio = document.querySelector('.music-player audio');
    var img = document.querySelector('.music-player img');
    var playBtn = document.getElementById('playBtn');
    var pauseBtn = document.getElementById('pauseBtn');
    var volumeSlider = document.getElementById('volumeSlider');
    var player = document.querySelector('.music-player');

    playBtn.onclick = function() { audio.play(); img.classList.add('spinning'); };
    pauseBtn.onclick = function() { audio.pause(); img.classList.remove('spinning'); };
    audio.onended = function() { img.classList.remove('spinning'); };
    volumeSlider.oninput = function() { audio.volume = volumeSlider.value; };
    var progressFill = document.getElementById('progressFill');
    var timeCurrent = document.getElementById('timeCurrent');
    var timeTotal = document.getElementById('timeTotal');
    var progressBar = document.getElementById('progressBar');
    audio.addEventListener('loadedmetadata', function() {
      timeTotal.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', function() {
      var pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });
    progressBar.addEventListener('click', function(e) {
      var rect = progressBar.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    var trailDots = [];
    var trailCount = 15;
    for (var i = 0; i < trailCount; i++) {
      var dot = document.createElement('div');
      dot.className = 'trail-dot';
      dot.style.opacity = '0';
      var size = 6 - i * 0.3;
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      document.body.appendChild(dot);
      trailDots.push({ el: dot, x: 0, y: 0 });
    }
    var mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    document.addEventListener('mouseleave', function() {
      trailDots.forEach(function(d) { d.el.style.opacity = '0'; });
    });
    function animateTrail() {
      trailDots[0].el.style.left = mouseX + 'px';
      trailDots[0].el.style.top = mouseY + 'px';
      trailDots[0].el.style.opacity = '1';
      for (var i = 1; i < trailDots.length; i++) {
        var prev = trailDots[i - 1];
        var curr = trailDots[i];
        curr.x += (prev.x - curr.x) * 0.3;
        curr.y += (prev.y - curr.y) * 0.3;
        prev.x = parseFloat(prev.el.style.left) || mouseX;
        prev.y = parseFloat(prev.el.style.top) || mouseY;
        curr.el.style.left = curr.x + 'px';
        curr.el.style.top = curr.y + 'px';
        curr.el.style.opacity = Math.max(0, 1 - i / trailCount);
      }
      requestAnimationFrame(animateTrail);
    }
    animateTrail();

    var loader = document.getElementById('loader');
    var loadBar = document.getElementById('loadBar');
    var enterBtn = document.getElementById('enterBtn');
    var w = 0;
    var loadInterval = setInterval(function() {
      w += Math.random() * 30;
      if (w >= 100) { w = 100; clearInterval(loadInterval); }
      loadBar.style.width = w + '%';
      if (w >= 100) {
        setTimeout(function() {
          typeWriteText(loadText, 'Loaded', 50, function() {
            setTimeout(function() { loader.classList.add('show-btn'); }, 200);
          });
        }, 200);
      }
    }, 100);
    enterBtn.onclick = function() {
      loader.classList.add('hidden');
      audio.play().then(function() { img.classList.add('spinning'); }).catch(function(){});
    };
    var loadText = document.querySelector('#loader .text');
    function typeWriteText(el, text, speed, cb) {
      var i = 0;
      el.textContent = '';
      function tick() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(tick, speed);
        } else if (cb) { cb(); }
      }
      tick();
    }

    function typewriter(el, text, speed) {
      var i = 0;
      function tick() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(tick, speed);
        }
      }
      tick();
    }

    window.addEventListener('DOMContentLoaded', function() {
      typewriter(document.querySelector('.handle h1'), '『!Сapybara¡』', 40);
      typewriter(document.querySelector('.handle .at'), '@WotwFan', 60);
      typewriter(document.querySelector('.bio'), 'Bad person', 40);
      typewriter(document.querySelector('.stat'), 'idk what to type here', 40);
      typewriter(document.querySelectorAll('.panel h3')[0], 'About', 50);
      typewriter(document.querySelectorAll('.panel h3')[1], 'Interests', 50);
      typewriter(document.querySelectorAll('.panel h3')[2], 'Projects', 50);
      typewriter(document.querySelectorAll('.panel h3')[3], 'Links', 50);
      var linksPs = document.querySelectorAll('.panel')[3].querySelectorAll('p');
      typewriter(linksPs[0], 'Discord: sudoeoev', 40);
      typewriter(linksPs[1], 'Usernames u may know: Capybara, 7day, Demidozz1, hummerhow, WotwFan, materialbase_color, Fuzzberry, someonebad, horrible,', 40);
      typewriter(document.querySelector('.footer'), ':3', 40);
    });
  </script>
  <div class="spacer"></div>
  <div class="content">
    <div class="handle">
      <h1></h1>
      <div class="at"></div>
    </div>
    <p class="bio"></p>
    <div class="stats">
      <div class="stat"></div>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
      <p></p>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
