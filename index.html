<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000; color: #c9d1d9; line-height: 1.6;
      overflow-y: scroll;
    }
    .avatar-fixed {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 80px; border-radius: 50%;
      background: #161b22; border: 2px solid #30363d; z-index: 100;
      overflow: hidden;
    }
    .avatar-fixed img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .spacer { height: 140px; }
    .content { padding: 0 20px 40px; max-width: 720px; margin: 0 auto; }
    .handle { text-align: center; margin-bottom: 8px; }
    .handle h1 { color: #e6edf3; font-size: 24px; }
    .handle .at { color: #8b949e; font-size: 14px; }
    .bio { text-align: center; margin: 16px 0; color: #c9d1d9; font-size: 15px; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; flex-wrap: wrap; }
    .stat { color: #8b949e; font-size: 14px; }
    .stat span { color: #58a6ff; }
    .panel { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .panel h3 { font-size: 16px; color: #e6edf3; margin-bottom: 8px; }
    .panel p { font-size: 14px; color: #8b949e; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #21262d; text-align: center; font-size: 12px; color: #484f58; }
  </style>
</head>
<body>
  <div class="avatar-fixed"><img src="https://images-ext-1.discordapp.net/external/MnFq7Ayc_rOQQaCTWb2t9lwyhigo69zaugW7tV3XBpc/%3Fsize%3D512/https/cdn.discordapp.com/avatars/1139133371683971093/6b941183dd830d0df1a4ce95cb03259b.png?format=webp&quality=lossless" alt="avatar"></div>
  <div class="spacer"></div>
  <div class="content">
    <div class="handle">
      <h1>『!Сapybara¡』</h1>
      <div class="at"></div>
    </div>
    <p class="bio">Developer &amp; maker. Building tools, mods, and experiments.</p>
    <div class="stats">
      <div class="stat"><span>24</span> repos</div>
      <div class="stat"><span>3</span> stars</div>
      <div class="stat"><span>1</span> following</div>
      <div class="stat"><span>0</span> followers</div>
    </div>
    <div class="panel">
      <h3>About</h3>
      <p>
      </p>
    </div>
    <div class="panel">
      <h3>Interests</h3>
      <p></p>
    </div>
    <div class="panel">
      <h3>Projects</h3>
      <p></p>
    </div>
    <div class="panel">
      <h3>Links</h3>
      <p>Discord: sudoeoev
      Telegram: @WotwFan</p>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
