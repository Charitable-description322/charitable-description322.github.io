<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { min-height: 100%; height: auto; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000; color: #e6edf3; line-height: 1.7;
      overflow-y: scroll;
      background-image: url('https://preview.redd.it/what-do-you-think-humanity-did-after-the-ending-of-the-2005-v0-9f1z1324rpqe1.jpeg?auto=webp&s=85d566fac420a04ba0ed0462d6af18469e052373');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.2) 100%);
      z-index: -1;
    }
    .stars {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.15), transparent),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1.5px 1.5px at 40% 30%, rgba(255,255,255,0.25), transparent),
        radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.15), transparent),
        radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.2), transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .trail-dot {
      position: fixed; width: 5px; height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 3px rgba(255,255,255,0.4);
      pointer-events: none; z-index: 9999;
    }
    #loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      cursor: pointer; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .bar { width: 220px; height: 3px; background: #1a1a2e; border-radius: 4px; overflow: hidden; }
    #loader .bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, #444, #aaa, #fff); border-radius: 4px; transition: width 0.3s ease; background-size: 200%; animation: gradShift 2s linear infinite; }
    @keyframes gradShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    #loader .text { color: #8b949e; font-size: 13px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; transition: opacity 0.3s ease; }
    #loader .enter-btn {
      opacity: 0; transition: all 0.5s ease;
      padding: 12px 32px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500;
      background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
      cursor: pointer; letter-spacing: 1px;
    }
    #loader .enter-btn:hover { border-color: #fff; background: rgba(255,255,255,0.1); box-shadow: 0 0 24px rgba(255,255,255,0.1); }
    #loader.show-btn .enter-btn { opacity: 1; }
    .avatar-fixed {
      position: relative; margin: 50px auto 0;
      width: 150px; height: 150px; border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
      z-index: 100; overflow: hidden;
    }
    .avatar-fixed img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .spacer { height: 30px; }
    .content { padding: 0 24px 60px; max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
    .handle { text-align: center; margin-bottom: 4px; }
    .handle h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #fff, #a0a0b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    .handle .at { color: #6b7280; font-size: 14px; font-weight: 400; }
    .bio { text-align: center; margin: 24px 0; color: #9ca3af; font-size: 15px; font-weight: 300; max-width: 480px; margin-left: auto; margin-right: auto; }
    .stats { display: flex; justify-content: center; gap: 24px; margin: 28px 0; flex-wrap: wrap; }
    .stat { color: #6b7280; font-size: 14px; font-weight: 300; }
    @keyframes borderGlow {
      0%, 100% { border-color: rgba(255,255,255,0.08); box-shadow: 0 0 0 transparent; }
      50% { border-color: rgba(255,255,255,0.15); box-shadow: 0 0 30px rgba(255,255,255,0.03); }
    }
    .panel {
      background: rgba(10,12,18,0.5); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: borderGlow 4s ease-in-out infinite;
    }
    .panel:hover {
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
      transform: translateY(-3px);
    }
    .panel h3 { font-size: 15px; color: #e6edf3; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .panel p { font-size: 14px; color: #9ca3af; font-weight: 300; line-height: 1.8; }
    .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 12px; color: #484f58; font-weight: 300; }
    .music-player {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: rgba(10,12,18,0.6); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s ease; min-width: 100px;
    }
    .music-player:hover {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .music-player img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .music-player img.spinning { animation: spin 3s linear infinite; }
    .music-player .player-info { flex: 1; min-width: 0; }
    .music-player .player-info .song-title { font-size: 13px; color: #e6edf3; font-weight: 500; white-space: nowrap; }
    .music-player .player-info .song-artist { font-size: 11px; color: #6b7280; font-weight: 300; }
    .music-player audio { display: none; }
    .music-player .controls { display: flex; gap: 6px; align-items: center; }
    .music-player .controls button {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #d1d5db; border-radius: 6px; padding: 6px 10px;
      cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    .music-player .controls button:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
    .music-player input[type="range"] {
      width: 56px; height: 3px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; cursor: pointer;
    }
    .music-player input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.3);
    }
    .progress-wrap {
      width: 100%; display: flex; align-items: center; gap: 8px;
      position: relative; order: 1; margin-top: 2px;
    }
    .progress-bar {
      flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #444, #aaa, #fff);
      border-radius: 2px; transition: width 0.1s linear; background-size: 200%; animation: gradShift 2s linear infinite;
    }
    .progress-wrap .time-current,
    .progress-wrap .time-total {
      font-size: 10px; color: #6b7280; min-width: 28px; text-align: center; font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div id="loader">
    <div class="bar"><div class="bar-inner" id="loadBar"></div></div>
    <div class="text">Loading...</div>
    <div class="enter-btn" id="enterBtn">Click to Enter</div>
  </div>
  
  <div class="avatar-fixed"><img src="https://images-ext-1.discordapp.net/external/MnFq7Ayc_rOQQaCTWb2t9lwyhigo69zaugW7tV3XBpc/%3Fsize%3D512/https/cdn.discordapp.com/avatars/1139133371683971093/6b941183dd830d0df1a4ce95cb03259b.png?format=webp&quality=lossless" alt="avatar"></div>
  <div class="music-player">
    <img src="song.webp" alt="album art" onerror="this.style.display='none'">
    <div class="player-info">
      <div class="song-title">Seasons In The Sun</div>
      <div class="song-artist">Nirvana</div>
    </div>
    <div class="controls">
      <button id="playBtn">▶</button>
      <button id="pauseBtn">⏸</button>
      <span style="color:#6b7280;font-size:11px;font-weight:300">Vol</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="progress-wrap" id="progressWrap">
      <span class="time-current" id="timeCurrent">0:00</span>
      <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressFill"></div></div>
      <span class="time-total" id="timeTotal">0:00</span>
    </div>
    <audio src="song.mp3" preload="none"></audio>
  </div>
  <script>
    var audio = document.querySelector('.music-player audio');
    var img = document.querySelector('.music-player img');
    var playBtn = document.getElementById('playBtn');
    var pauseBtn = document.getElementById('pauseBtn');
    var volumeSlider = document.getElementById('volumeSlider');
    var player = document.querySelector('.music-player');

    playBtn.onclick = function() { audio.play(); img.classList.add('spinning'); };
    pauseBtn.onclick = function() { audio.pause(); img.classList.remove('spinning'); };
    audio.onended = function() { img.classList.remove('spinning'); };
    volumeSlider.oninput = function() { audio.volume = volumeSlider.value; };
    var progressFill = document.getElementById('progressFill');
    var timeCurrent = document.getElementById('timeCurrent');
    var timeTotal = document.getElementById('timeTotal');
    var progressBar = document.getElementById('progressBar');
    audio.addEventListener('loadedmetadata', function() {
      timeTotal.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', function() {
      var pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });
    progressBar.addEventListener('click', function(e) {
      var rect = progressBar.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    var trailDots = [];
    var trailCount = 12;
    for (var i = 0; i < trailCount; i++) {
      var dot = document.createElement('div');
      dot.className = 'trail-dot';
      dot.style.opacity = '0';
      var size = 5 - i * 0.3;
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      document.body.appendChild(dot);
      trailDots.push({ el: dot, x: 0, y: 0 });
    }
    var mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX; mouseY = e.clientY;
    });
    document.addEventListener('mouseleave', function() {
      trailDots.forEach(function(d) { d.el.style.opacity = '0'; });
    });
    function animateTrail() {
      trailDots[0].el.style.left = mouseX + 'px';
      trailDots[0].el.style.top = mouseY + 'px';
      trailDots[0].el.style.opacity = '1';
      for (var i = 1; i < trailDots.length; i++) {
        var prev = trailDots[i - 1];
        var curr = trailDots[i];
        curr.x += (prev.x - curr.x) * 0.3;
        curr.y += (prev.y - curr.y) * 0.3;
        prev.x = parseFloat(prev.el.style.left) || mouseX;
        prev.y = parseFloat(prev.el.style.top) || mouseY;
        curr.el.style.left = curr.x + 'px';
        curr.el.style.top = curr.y + 'px';
        curr.el.style.opacity = Math.max(0, 1 - i / trailCount);
      }
      requestAnimationFrame(animateTrail);
    }
    animateTrail();

    var loader = document.getElementById('loader');
    var loadBar = document.getElementById('loadBar');
    var enterBtn = document.getElementById('enterBtn');
    var w = 0;
    var loadInterval = setInterval(function() {
      w += Math.random() * 30;
      if (w >= 100) { w = 100; clearInterval(loadInterval); }
      loadBar.style.width = w + '%';
      if (w >= 100) {
        setTimeout(function() {
          typeWriteText(loadText, 'Loaded', 50, function() {
            setTimeout(function() { loader.classList.add('show-btn'); }, 200);
          });
        }, 200);
      }
    }, 100);
    enterBtn.onclick = function() {
      loader.classList.add('hidden');
      audio.play().then(function() { img.classList.add('spinning'); }).catch(function(){});
    };
    var loadText = document.querySelector('#loader .text');
    function typeWriteText(el, text, speed, cb) {
      var i = 0;
      el.textContent = '';
      function tick() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(tick, speed);
        } else if (cb) { cb(); }
      }
      tick();
    }

    function typewriter(el, text, speed) {
      var i = 0;
      function tick() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(tick, speed);
        }
      }
      tick();
    }

    window.addEventListener('DOMContentLoaded', function() {
      typewriter(document.querySelector('.handle h1'), '『!Сapybara¡』', 40);
      typewriter(document.querySelector('.handle .at'), '@WotwFan', 60);
      typewriter(document.querySelector('.bio'), 'Bad person', 40);
      typewriter(document.querySelector('.stat'), 'idk what to type here', 40);
      typewriter(document.querySelectorAll('.panel h3')[0], 'About', 50);
      typewriter(document.querySelectorAll('.panel h3')[1], 'Interests', 50);
      typewriter(document.querySelectorAll('.panel h3')[2], 'Projects', 50);
      typewriter(document.querySelectorAll('.panel h3')[3], 'Links', 50);
      var linksPs = document.querySelectorAll('.panel')[3].querySelectorAll('p');
      typewriter(linksPs[0], 'Discord: sudoeoev', 40);
      typewriter(linksPs[1], 'Telegram: @WotwFan', 40);
      typewriter(linksPs[2], 'Usernames u may know: Capybara, 7day, Demidozz1, hummerhow, WotwFan, materialbase_color, Fuzzberry, someonebad, horrible,', 40);
      typewriter(document.querySelector('.footer'), ':3', 40);
    });
  </script>
  <div class="spacer"></div>
  <div class="content">
    <div class="handle">
      <h1></h1>
      <div class="at"></div>
    </div>
    <p class="bio"></p>
    <div class="stats">
      <div class="stat"></div>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
    </div>
    <div class="panel">
      <h3></h3>
      <p></p>
      <p></p>
      <p></p>
    </div>
    <div class="footer"></div>
  </div>
</body>
</html>
